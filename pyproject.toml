[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhi-business-challenge"
version = "1.0.0"
description = "Urban Heat Island classification across Rio, Santiago and Freetown from satellite data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Youness Yachruti"}]
# Modelling: enough to run every notebook from the committed data/ folder.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter",
]

[project.optional-dependencies]
# Re-extracting satellite features with uhi_pipe (Planetary Computer).
extract = [
    "xarray>=2023.1",
    "rioxarray>=0.14",
    "rasterio>=1.3",
    "odc-stac>=0.3",
    "pystac-client>=0.6",
    "planetary-computer>=0.5",
    "pyarrow>=12.0",
    "geopandas>=0.14",
    "shapely>=2.0",
]

[tool.setuptools.packages.find]
include = ["uhi_models*", "uhi_pipe*"]
